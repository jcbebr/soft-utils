<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <div class="header">
    <h1>Preencher CT</h1>
    <label for="fillCtSearchFor">Buscar roteiro por</label>
    <input id="fillCtSearchFor" type="text">
  </div>
  <div class="header">
    <h1>Kanban Sync</h1>
    <label for="kanbanPageUrl">URL do kanban</label>
    <input id="kanbanPageUrl" type="text">
    <label for="kanbanWorkspaceId">Workspace ID</label>
    <input id="kanbanWorkspaceId" type="text">
    <label for="kanbanIntervalMinutes">Intervalo (min)</label>
    <input id="kanbanIntervalMinutes" type="number" min="1" step="1">
    <label for="gitlabToken">GitLab token</label>
    <input id="gitlabToken" type="password">
  </div>
  <div class="header">
    <h1>Geral</h1>
    <label for="inputColorBackground">Cor tema</label>
    <div class="cpWrapper">
      <input type="color" id="inputColorBackground" value="#8888ff" />
    </div>
    <label for="inputColorText">Cor texto</label>
    <div class="cpWrapper">
      <input type="color" id="inputColorText" value="#8888ff" />
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>

</html>
